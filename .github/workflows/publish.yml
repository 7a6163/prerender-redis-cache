name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # Required for provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for creating GitHub releases
      id-token: write  # required to use OIDC

    services:
      redis:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    - run: npm ci

    - run: npm run lint

    - run: npm test -- --forceExit

    - run: npm run test:mutation

    - uses: JS-DevTools/npm-publish@v4

    # actions/create-release is archived; gh is preinstalled on the runner
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          --title "Release $GITHUB_REF_NAME" \
          --notes "See [CHANGELOG.md](https://github.com/7a6163/prerender-redis-cache/blob/master/CHANGELOG.md) for details."
